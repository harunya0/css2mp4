[package]
name = "css2mp4-core"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime", "bytes"] }
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tempfile = "3.17"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "fs", "sync"] }
